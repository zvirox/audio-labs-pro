name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    uses: zvirox/release-workflows/.github/workflows/linux-release.yml@v1
    with:
      app_name: ${{ github.event.repository.name }}
      frontend_dir: frontend
      system_deps: libasound2-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libxkbcommon-dev libwayland-dev wayland-protocols libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev shared-mime-info
      build_cmd: cargo build --release --locked -p alp-desktop -p alp-cli -p alp-infer -p alp-mcp
      binary_path: target/release/audio-labs-pro
      runs_on: ubuntu-22.04
      nfpm_config: packaging/nfpm.yaml
    secrets: inherit
