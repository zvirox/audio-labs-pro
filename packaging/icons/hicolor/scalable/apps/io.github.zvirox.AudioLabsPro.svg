<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121824"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" filter="url(#shadow)"/>

  <!-- Subtle Glass Surface Rim -->
  <rect x="40" y="40" width="432" height="432" rx="100" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- Waveform Equalizer / Voice Audio Lab Graphic -->
  <g transform="translate(64, 116)">
    <!-- Audio Wave Bars with Rounded Caps -->
    <rect x="36" y="110" width="24" height="60" rx="12" fill="url(#glowGrad)" opacity="0.6"/>
    <rect x="80" y="70" width="24" height="140" rx="12" fill="url(#glowGrad)" opacity="0.75"/>
    <rect x="124" y="30" width="24" height="220" rx="12" fill="url(#glowGrad)" opacity="0.9"/>
    <rect x="168" y="80" width="24" height="120" rx="12" fill="url(#glowGrad)" opacity="0.8"/>
    <rect x="212" y="10" width="24" height="260" rx="12" fill="url(#accentGrad)"/>
    <rect x="256" y="50" width="24" height="180" rx="12" fill="url(#glowGrad)" opacity="0.9"/>
    <rect x="300" y="90" width="24" height="100" rx="12" fill="url(#glowGrad)" opacity="0.75"/>
    <rect x="344" y="120" width="24" height="40" rx="12" fill="url(#glowGrad)" opacity="0.6"/>
  </g>

  <!-- Glowing Circular Lab Reticle / Master Dial Indicator -->
  <circle cx="256" cy="400" r="14" fill="#38bdf8"/>
  <circle cx="256" cy="400" r="28" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 6" opacity="0.8"/>
</svg>
