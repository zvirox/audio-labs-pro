app-id: io.github.zvirox.AudioLabsPro
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: audio-labs-pro
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  - --device=all
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: audio-labs-pro
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      # Cargo downloads its crates.io dependencies during the module build;
      # the flatpak-builder sandbox has no network by default.
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/audio-labs-pro/cargo
    build-commands:
      - cargo build --release --locked --workspace
      - install -Dm755 target/release/alp-ui /app/bin/audio-labs-pro
      - install -Dm755 target/release/alp-cli /app/bin/alp-cli
      - install -Dm755 target/release/alp-infer /app/bin/alp-infer
      - install -Dm644 packaging/desktop/io.github.zvirox.AudioLabsPro.desktop /app/share/applications/io.github.zvirox.AudioLabsPro.desktop
      - install -Dm644 packaging/desktop/io.github.zvirox.AudioLabsPro.metainfo.xml /app/share/metainfo/io.github.zvirox.AudioLabsPro.metainfo.xml
      - install -Dm644 packaging/mime/io.github.zvirox.AudioLabsPro.xml /app/share/mime/packages/io.github.zvirox.AudioLabsPro.xml
      - mkdir -p /app/share/icons/hicolor
      - cp -r packaging/icons/hicolor/. /app/share/icons/hicolor/
    sources:
      - type: dir
        path: ../../
