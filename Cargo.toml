[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-beta.6"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/zvirox/audio-labs-pro"
publish = false

[workspace.dependencies]
alp-core = { path = "crates/alp-core" }
alp-dsp = { path = "crates/alp-dsp" }
alp-engine = { path = "crates/alp-engine" }
alp-media = { path = "crates/alp-media" }
alp-voice = { path = "crates/alp-voice" }
alp-api = { path = "crates/alp-api" }
alp-mcp = { path = "crates/alp-mcp" }
alp-plugin = { path = "crates/alp-plugin" }
alp-session = { path = "crates/alp-session" }

anyhow = "1.0"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.18.2"
crane-core = "=26.9.0"
dirs = "7.0.0"
flacenc = { version = "0.5.1", default-features = false }
libloading = "0.8.9"
nix = { version = "0.30.1", default-features = false, features = ["socket", "user"] }
hound = "3.5.1"
nnnoiseless = "0.5.2"
mp4 = "0.14.0"
oxideav-aac = "0.1.7"
ort = "=2.0.0-rc.10"
piper-plus-g2p = { version = "0.5.2", default-features = false, features = ["english", "bundled-dicts"] }
realfft = "3.5"
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip"] }
fs4 = { version = "1.1", features = ["sync"] }
proptest = "1.12.0"
rtrb = "0.4.0"
rubato = "5.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.6.1", default-features = false, features = [
  "aiff",
  "flac",
  "id3v2",
  "mp3",
  "ogg",
  "opt-simd",
  "pcm",
  "vorbis",
  "wav",
] }
tempfile = "3.27"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.27", features = ["serde", "v4"] }
vst3 = "0.3.0"
x11rb = "0.13.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
